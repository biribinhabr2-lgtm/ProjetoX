# Configuração do projeto Supabase
# Referência: https://supabase.com/docs/guides/functions/deploy#configuration

# ── Edge Functions ────────────────────────────────────────────────────────

# create-subscription: requer JWT (padrão — não precisa declarar)
[functions.create-subscription]
verify_jwt = true

# mp-webhook: endpoint público para o Mercado Pago; sem JWT
# O MP não envia Authorization header nas notificações.
# Segurança garantida por verificação ativa na API do MP (nunca confiamos
# apenas no corpo da requisição).
[functions.mp-webhook]
verify_jwt = false

# send-email: chamável pelo frontend público (orcamento-aceito não tem sessão)
# e autenticado (boas-vindas). RESEND_API_KEY fica exclusivamente no servidor.
[functions.send-email]
verify_jwt = false

# create-api-key: requer JWT (usuário logado owner/admin)
[functions.create-api-key]
verify_jwt = true

# api-v1: autenticação própria via API Key (Bearer fh_live_xxx)
# O Supabase JWT não é usado — a chave é verificada pelo handler.
[functions.api-v1]
verify_jwt = false
